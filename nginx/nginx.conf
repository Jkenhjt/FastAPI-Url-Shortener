worker_processes 2;
daemon off;

events {
	worker_connections 1024;
}

http {
	server {
		listen 443;
		gzip on;
		gzip_comp_level 6;

		location / {
			proxy_pass http://fastapi:8000;
			proxy_ignore_client_abort on;
		}
	}

	server {
		listen 8080;

		location = /stub_status {
    			stub_status;
		}
	}
}
