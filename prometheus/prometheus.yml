global:
  scrape_interval: 1s

scrape_configs:
  - job_name: "prometheus"

    static_configs:
      - targets: ["0.0.0.0:9090"]

  - job_name: "node-exporter"

    static_configs:
      - targets: ["prometheus_node_exporter:9100"]

  - job_name: "nginx-exporter"

    static_configs:
      - targets: ["nginx_exporter:9113"]
